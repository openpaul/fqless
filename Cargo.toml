[package]
name = "fqless"
version = "2.3.1"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
termion = "4.0"  
ratatui = { version = "0.29", default-features = false, features = ["termion"] }         # TUI rendering
memmap2 = "0.9"          # Efficient file mapping
rayon = "1.10"           # Parallel index building
anyhow = "1.0.98"        # Error handling
flate2 = "1.0"           # Gzip compression support
bio = "2.3.0"
aho-corasick = "1.1"
num-format = "0.4.4"
signal-hook = "0.3.18"
nix = { version = "0.30", features = ["poll"] }
noodles-bam = "0.98.0"
noodles-bgzf = "0.52.0"
noodles-sam = "0.93.0"
noodles-cram = "0.102.0"
noodles-fasta = "0.68.0"

[dev-dependencies]
noodles-core = "0.21"
tempfile = "3.13"
