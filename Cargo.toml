[package]
name = "fqless"
version = "2.3.1"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
termion = "4.0"  
ratatui = { version = "0.29", default-features = false, features = ["termion"] }         # TUI rendering
anyhow = "1.0.98"        # Error handling
flate2 = "1.0"           # Gzip compression support
bio = "2.3.0"
aho-corasick = "1.1"
memchr = "2.7"            # SIMD substring search
num-format = "0.4.4"
signal-hook = "0.3.18"
nix = { version = "0.30", features = ["poll"] }

[dev-dependencies]
tempfile = "3.13"
